name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  core:
    # The core must work with no third-party packages, so Django is not installed here.
    name: Core, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Check Django is absent
        run: uv run --isolated --no-dev python -c "import importlib.util as u, sys; sys.exit(u.find_spec('django') is not None)"
      - run: uv run --isolated --no-dev --with pytest pytest

  django:
    name: Django ${{ matrix.django }}, DRF ${{ matrix.drf }}, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported versions of everything.
          - { python: "3.11", django: "5.2", drf: "3.16" }
          # Django 5.2 LTS supports Python 3.10-3.14; Django 6.x needs Python 3.12+.
          - { python: "3.11", django: "5.2", drf: "latest" }
          - { python: "3.12", django: "5.2", drf: "latest" }
          - { python: "3.13", django: "5.2", drf: "latest" }
          - { python: "3.14", django: "5.2", drf: "latest" }
          - { python: "3.12", django: "6.0", drf: "latest" }
          - { python: "3.13", django: "6.0", drf: "latest" }
          - { python: "3.14", django: "6.0", drf: "latest" }
          - { python: "3.12", django: "6.1", drf: "latest" }
          - { python: "3.13", django: "6.1", drf: "latest" }
          - { python: "3.14", django: "6.1", drf: "latest" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run tests
        env:
          DRF: ${{ matrix.drf == 'latest' && 'djangorestframework' || format('djangorestframework=={0}.*', matrix.drf) }}
        run: >-
          uv run --isolated --no-dev
          --with "django==${{ matrix.django }}.*"
          --with "$DRF"
          --with pytest --with pytest-django
          pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check the wheel ships the data, migrations and static files
        run: |
          unzip -l dist/*.whl > contents.txt
          for path in data/zones.json data/states.json data/lgas.json py.typed \
                      django/migrations/0001_initial.py \
                      django/static/naija_geo/state_lga.js \
                      django/management/commands/load_naija_geo.py; do
            grep -q "naija_geo/$path" contents.txt || { echo "missing: $path"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
